include current-theme.conf

# =========================
# ENV
# =========================
env TERM=xterm-256color
env WINIT_X11_SCALE_FACTOR=1

# =========================
# WINDOW
# =========================
title Term

# Rozmiar startowy
initial_window_width 100c
initial_window_height 30c

# Padding
window_padding_width 4

# Dekoracje
hide_window_decorations no

# Opacity
background_opacity 0.97

# Klasa okna (WM_CLASS)
class Kitty
name Kitty

# =========================
# SCROLLING
# =========================
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# =========================
# FONT
# =========================
font_family monospace
bold_font monospace Bold
italic_font monospace Italic
bold_italic_font monospace Bold Italic
font_size 12.0

# =========================
# SELECTION
# =========================
copy_on_select yesve_config_reload = true
working_directory = "None"
select_by_word_characters ",│`|:\"' ()[]{}<>"

# =========================
# CURSOR
# =========================
cursor_shape underline
cursor_underline_thickness 1.5
cursor_blink_interval 0
cursor_stop_blinking_after 0
shell_integration no-cursor

# =========================
# MOUSE
# =========================
mouse_hide_wait 0.0

# =========================
# KEYBOARD
# =========================

# Copy / Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map paste paste_from_clipboard
map copy copy_to_clipboard

# Ctrl+L (clear screen)
map ctrl+l send_text all \x0c

# Scroll bindings
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end

# Search
map ctrl+shift+f show_scrollback
map ctrl+shift+b search_backward

# Reset font size
map ctrl+0 change_font_size all 0

enable_audio_bell no
confirm_os_window_close 0
